name: Deploy portfolio-frontend to GitHub Pages

on:
  push:
    branches: ["main"] # O "master", según el nombre de tu rama principal

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      # Aquí indicas la carpeta exacta donde está tu proyecto
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './portfolio-frontend'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4