<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
    <pattern id="dots" width="32" height="32" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.4" fill="#ffffff" opacity="0.07"/>
    </pattern>
    <radialGradient id="glow" cx="230" cy="330" r="330" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#7C3AED" stop-opacity="0.32"/>
      <stop offset="1" stop-color="#7C3AED" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="fade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0f1115" stop-opacity="0"/>
      <stop offset="1" stop-color="#0f1115"/>
    </linearGradient>
  </defs>

  <!-- Fondo -->
  <rect width="1600" height="900" fill="#0f1115"/>
  <rect width="1600" height="900" fill="url(#dots)"/>
  <rect width="1600" height="900" fill="url(#glow)"/>

  <g transform="translate(200 0)">
  <!-- Wireframe de móvil -->
  <rect x="90" y="90" width="280" height="480" rx="36" fill="#171a21" stroke="#3a3f4b" stroke-width="2"/>
  <rect x="190" y="108" width="80" height="10" rx="5" fill="#2a2f3a"/>
  <rect x="115" y="140" width="230" height="28" rx="8" fill="#232834"/>

  <rect x="115" y="185" width="230" height="130" rx="14" fill="#1d2230" stroke="#3a3f4b" stroke-width="1.5" stroke-dasharray="6 6"/>
  <line x1="115" y1="185" x2="345" y2="315" stroke="#3a3f4b" stroke-width="1.5"/>
  <line x1="345" y1="185" x2="115" y2="315" stroke="#3a3f4b" stroke-width="1.5"/>

  <rect x="115" y="335" width="230" height="10" rx="5" fill="#2a2f3a"/>
  <rect x="115" y="355" width="200" height="10" rx="5" fill="#2a2f3a"/>
  <rect x="115" y="375" width="150" height="10" rx="5" fill="#2a2f3a"/>

  <rect x="115" y="405" width="110" height="70" rx="12" fill="#1d2230"/>
  <rect x="235" y="405" width="110" height="70" rx="12" fill="#1d2230"/>

  <!-- Botón seleccionado -->
  <rect x="115" y="500" width="230" height="44" rx="22" fill="#7C3AED"/>
  <rect x="107" y="492" width="246" height="60" rx="6" fill="none" stroke="#2563EB" stroke-width="2" stroke-dasharray="5 4"/>
  <g fill="#ffffff" stroke="#2563EB" stroke-width="2">
    <rect x="102" y="487" width="10" height="10" rx="2"/>
    <rect x="348" y="487" width="10" height="10" rx="2"/>
    <rect x="102" y="547" width="10" height="10" rx="2"/>
    <rect x="348" y="547" width="10" height="10" rx="2"/>
  </g>

  <!-- Cursor -->
  <path d="M296 520 L296 562 L307 552 L316 573 L325 569 L316 549 L331 549 Z" fill="#ffffff" stroke="#0f1115" stroke-width="2" stroke-linejoin="round"/>

  <!-- Nota adhesiva -->
  <g transform="rotate(7 370 155)">
    <rect x="322" y="107" width="96" height="96" rx="6" fill="#F59E0B"/>
    <rect x="338" y="128" width="64" height="8" rx="4" fill="#0f1115" opacity="0.55"/>
    <rect x="338" y="146" width="48" height="8" rx="4" fill="#0f1115" opacity="0.55"/>
    <rect x="338" y="164" width="56" height="8" rx="4" fill="#0f1115" opacity="0.55"/>
  </g>

  <!-- Título -->
  <text x="470" y="170" font-size="32" font-weight="500" fill="#9aa3b2">Foundations of</text>
  <text x="464" y="300" font-size="132" font-weight="800" fill="#ffffff" letter-spacing="-3">UX Design</text>

  <!-- Design thinking: 5 etapas -->
  <line x1="480" y1="396" x2="1060" y2="396" stroke="#3a3f4b" stroke-width="3"/>
  <g font-size="22" font-weight="700" text-anchor="middle">
    <circle cx="480" cy="396" r="24" fill="#F59E0B"/><text x="480" y="404" fill="#0f1115">1</text>
    <circle cx="625" cy="396" r="24" fill="#10B981"/><text x="625" y="404" fill="#0f1115">2</text>
    <circle cx="770" cy="396" r="24" fill="#2563EB"/><text x="770" y="404" fill="#ffffff">3</text>
    <circle cx="915" cy="396" r="24" fill="#7C3AED"/><text x="915" y="404" fill="#ffffff">4</text>
    <circle cx="1060" cy="396" r="24" fill="#EF4444"/><text x="1060" y="404" fill="#ffffff">5</text>
  </g>
  <g font-size="21" font-weight="500" fill="#c7cdd8" text-anchor="middle">
    <text x="480" y="450">Empatizar</text>
    <text x="625" y="450">Definir</text>
    <text x="770" y="450">Idear</text>
    <text x="915" y="450">Prototipar</text>
    <text x="1060" y="450">Probar</text>
  </g>

  <!-- Etiquetas -->
  <g font-size="20" font-weight="600" fill="#e5e7eb">
    <rect x="470" y="512" width="170" height="44" rx="22" fill="#2563EB" fill-opacity="0.22" stroke="#2563EB" stroke-opacity="0.7"/>
    <text x="555" y="541" text-anchor="middle">Accesibilidad</text>
    <rect x="656" y="512" width="190" height="44" rx="22" fill="#10B981" fill-opacity="0.22" stroke="#10B981" stroke-opacity="0.7"/>
    <text x="751" y="541" text-anchor="middle">Diseño inclusivo</text>
  </g>

  <!-- Degradado inferior para el texto de la tarjeta -->
  <rect y="600" width="1200" height="300" fill="url(#fade)"/>
  </g>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
